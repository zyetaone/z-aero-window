<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Wall Control</title>
		<style>
			:root { --ground: #f4f5f7; --ink: #1d2430; --muted: #5d6675; --line: #d5d9e0; --accent: #b35a17; --on-accent: #fff; --field: #fff; }
			@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --ground: #12161c; --ink: #e8ebf0; --muted: #98a1b0; --line: #2c333d; --accent: #f0a05a; --on-accent: #21140a; --field: #1a1f27; } }
			:root[data-theme='dark'] { --ground: #12161c; --ink: #e8ebf0; --muted: #98a1b0; --line: #2c333d; --accent: #f0a05a; --on-accent: #21140a; --field: #1a1f27; }
			body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
			main { max-width: 26rem; margin: 0 auto; padding: 32px 16px; display: grid; gap: 20px; }
			h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
			p { margin: 0; color: var(--muted); }
			form { display: grid; gap: 14px; }
			label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
			select, input { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px; text-transform: none; letter-spacing: 0; }
			button { font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 6px; padding: 12px; cursor: pointer; }
			:is(select, input, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
			output { font: 14px/1.5 ui-monospace, monospace; color: var(--muted); font-variant-numeric: tabular-nums; white-space: pre-wrap; }
		</style>
	</head>
	<body>
		<main>
			<h1>Wall control</h1>
			<p>Sends one scene to every pane. The panes lower their blinds and change over together about ten seconds after you push.</p>
			<form>
				<label>Preset <select name="preset"></select></label>
				<label>Place <select name="place"></select></label>
				<label>Weather <select name="weather"></select></label>
				<label>Time of day <input name="clock" type="number" min="0" max="24" step="0.25" placeholder="Real local time" /></label>
				<label>Admin token <input name="token" type="password" autocomplete="off" placeholder="not needed on a dev server" /></label>
				<button type="submit">Push to wall</button>
			</form>
			<output aria-live="polite"></output>
		</main>
		<script type="module" src="./src/admin.ts"></script>
	</body>
</html>
