<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>aero-3</title>
		<style>
			html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
			canvas { display: block; width: 100%; height: 100%; outline: none; }
			#hud {
				position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center;
				padding: 6px 10px; border-radius: 8px; background: #0008; color: #fffc;
				font: 12px/1 ui-monospace, monospace; font-variant-numeric: tabular-nums;
			}
			#hud input { width: min(40vw, 360px); accent-color: #ffb35c; }
			#hud button { font: inherit; color: inherit; background: #fff2; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
			#hud button:disabled { opacity: 0.4; cursor: default; }
			#hud select { font: inherit; color: inherit; background: #fff2; border: 0; border-radius: 4px; padding: 3px 6px; }
			#hud select option { color: #000; }
			#hud button:focus-visible, #hud input:focus-visible, #hud summary:focus-visible, #hud select:focus-visible { outline: 2px solid #ffb35c; outline-offset: 2px; }
			#lights { position: relative; }
			#lights summary { cursor: pointer; padding: 4px 8px; border-radius: 4px; background: #fff2; list-style: none; }
			#lights[open] > div {
				position: absolute; bottom: calc(100% + 10px); left: 0; display: grid; grid-template-columns: auto 160px; gap: 8px 12px;
				align-items: center; padding: 10px 12px; border-radius: 8px; background: #000c;
			}
			#lights[open] input { width: 160px; }
			/* The cabin: rain on the glass, the window's rim, the blind. No backdrop-filter anywhere:
			   on the Pi it is a full-screen blur pass over WebGL. aero-2's Frame/RainGlass/Blind CSS. */
			.cabin { position: fixed; inset: 0; pointer-events: none; }
			.cabin[hidden] { display: none; }
			#hud { z-index: 4; }
			#hud[hidden] { display: none; }
			#frame { --night: 0; z-index: 2; box-shadow: inset 0 0 60px 18px #0009, inset 0 0 12px 2px #ffffff0d; }
			#frame::before {
				content: ''; position: absolute; inset: 0;
				background: radial-gradient(ellipse at 50% 50%, transparent 55%,
					rgb(10 16 26 / calc(0.25 * (0.55 + 0.45 * var(--night)))) 80%,
					rgb(5 8 14 / calc(0.65 * (0.55 + 0.45 * var(--night)))) 100%);
			}
			#frame::after {
				content: ''; position: absolute; inset: 0; /* a soft glint across the top right of the glass */
				background: linear-gradient(225deg, #ffffff0c 0%, #ffffff05 22%, transparent 42%);
			}
			#rain { z-index: 1; opacity: 0.75; }
			#rain span {
				position: absolute; border-radius: 50%; width: var(--s); height: var(--s);
				background: linear-gradient(135deg, #dcebff38, #b4c8e614 55%, #ffffff0a);
				box-shadow: inset 1.5px 2px 3px #fff6, inset -2px -3px 5px #0000004d, 0 2px 4px #00000026;
				animation: bead var(--dur) ease-in-out var(--delay) infinite;
			}
			#rain span::before {
				content: ''; position: absolute; top: 16%; left: 20%; width: 30%; height: 30%; border-radius: 50%;
				background: radial-gradient(circle, #ffffffeb, transparent 70%);
			}
			@keyframes bead {
				0% { opacity: 0; transform: translateY(-2px) scale(0.6); }
				12% { opacity: var(--o); transform: none; }
				68% { opacity: var(--o); transform: translateY(calc(var(--slide) * 0.12)); }
				100% { opacity: 0; transform: translateY(var(--slide)) scale(0.96); }
			}
			/* Closed in the markup, so a fresh load paints the blind before anything else. */
			#blind {
				z-index: 3; display: grid; place-content: center; gap: 10px; text-align: center;
				background:
					repeating-linear-gradient(180deg, #0000 0 5px, #00000006 5px 6px),
					linear-gradient(180deg, #d9d6cf, #ecebe6 40%, #e3e1db 85%, #b9b6ae 97%, #8f8c85);
				color: #0000004d; font: 300 clamp(14px, 1.6vw, 22px)/1.2 ui-sans-serif, system-ui, sans-serif;
				letter-spacing: 0.18em; text-transform: uppercase;
				transition: transform 2.4s cubic-bezier(0.6, 0, 0.3, 1);
			}
			#blind time { font-size: 0.8em; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
			#blind.open { transform: translateY(-101%); }
			/* The admin QR: hold the glass 15 s (cabin.ts). The ring says "keep going". */
			#hold { z-index: 5; display: grid; place-items: center; }
			#hold::after {
				content: ''; width: 72px; height: 72px; border-radius: 50%;
				background: conic-gradient(#fffc calc(var(--p, 0) * 1turn), #fff3 0);
				mask: radial-gradient(circle, transparent 28px, #000 29px);
			}
			#qr { z-index: 5; display: grid; place-content: center; justify-items: center; gap: 12px; background: #000c; color: #fffd; font: 16px/1.4 ui-sans-serif, system-ui, sans-serif; pointer-events: auto; }
			#qr svg { width: min(60vh, 320px); height: auto; background: #fff; border-radius: 8px; }
			@media (prefers-reduced-motion: reduce) { #blind { transition-duration: 0.3s; } #rain span { animation: none; opacity: var(--o); } }
		</style>
	</head>
	<body>
		<canvas id="world"></canvas>
		<div id="rain" class="cabin" hidden aria-hidden="true"></div>
		<div id="frame" class="cabin" aria-hidden="true"></div>
		<div id="blind" class="cabin" aria-hidden="true"><span></span><time></time></div>
		<div id="hold" class="cabin" hidden aria-hidden="true"></div>
		<div id="qr" class="cabin" hidden role="dialog" aria-label="Open the wall controls on a phone"><div></div><p></p></div>
		<div id="hud" hidden>
			<input type="range" min="0" max="24" step="0.05" aria-label="Time of day (local solar hour)" />
			<button type="button">Now</button>
			<select id="place" aria-label="Place"></select>
			<details id="lights">
				<summary>Lights</summary>
				<div>
					<label for="l-street">Streets</label><input id="l-street" name="street" type="range" min="0" max="2" step="0.05" />
					<label for="l-building">Buildings</label><input id="l-building" name="building" type="range" min="0" max="2" step="0.05" />
					<label for="l-far">Far towns</label><input id="l-far" name="far" type="range" min="0" max="2" step="0.05" />
					<label for="l-haze">Haze</label><input id="l-haze" name="haze" type="range" min="0" max="1" step="0.05" />
					<label for="l-glow">Glow</label><input id="l-glow" name="glow" type="range" min="0" max="1" step="0.05" />
				</div>
			</details>
			<output></output>
		</div>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
