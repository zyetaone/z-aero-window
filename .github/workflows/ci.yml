name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege default token — only read access to repo contents.
# The promote job elevates to contents:write for itself only.
permissions:
  contents: read

# Serialise runs per ref so the release promotion below converges to the
# newest green sha. PRs cancel superseded runs; main runs all complete
# (cancelling a main run could skip a promotion).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-check:
    name: Type-check & Build
    runs-on: ubuntu-latest
    # Without this GitHub's default is 360 minutes, so a wedged step — a smoke
    # waiting on a browser that never binds, a build that stalls on a fetch —
    # occupies a runner for six hours before anyone is told. Generous against
    # the real chain (minutes) and short enough to be a signal.
    timeout-minutes: 25
    # v1 moved from the repo root into aero-1/ when the tree split into two
    # applications with shared assets (data/, deploy/) at the top. Every step
    # in this job runs against that app, not the root, which no longer has a
    # package.json at all.
    defaults:
      run:
        working-directory: aero-1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # This project uses Bun, not npm. `bun.lock` is the authoritative
      # lockfile. `package-lock.json` may exist in the tree for historical
      # reasons but is not the source of truth for CI installs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, and the same pin as the aero-2 job below — for the same
          # reason spelled out there: a floating toolchain means a green build
          # can turn red with no commit, and the toolchain is then the only
          # variable left. That reasoning was written down two jobs down and
          # applied to the pre-ship rewrite while THIS job, the one that decides
          # what the fleet deploys, floated.
          #
          # Bumped 1.3.14 → 1.4.2 on 2026-09-29: the local toolchain had already
          # moved on, so this pin now tracks the version every local run —
          # all aero-1 tests, both apps' gates, both smoke suites — verifies
          # against, instead of a version nobody runs anymore.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
        run: bun run build

      # Boot the built artifact the way the Pi does (`bun run serve`, the exact
      # ExecStart of aero-app.service) and issue a real request. A green build
      # proves nothing about whether the server can SERVE it: server.ts once
      # wrapped adapter-node's Connect middleware as if it were a fetch handler,
      # so every request killed the process — a 10s systemd crash loop with a
      # dark kiosk, shipped through a fully green CI run. Only a real request
      # against a real build catches that class of bug.
      - name: Smoke test built server
        env:
          AERO_DISABLE_LAN_PROXY: '1'
          PORT: '3000'
        run: |
          bun run serve &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://localhost:3000/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://localhost:3000/api/status
          curl -fsS --max-time 5 -o /dev/null http://localhost:3000/
          # A second request proves the process survived the first, which is
          # precisely what the middleware-contract bug broke.
          curl -fsS --max-time 5 -o /dev/null http://localhost:3000/api/devices
          # `|| true`: GitHub runs these with `bash -e`, so a kill of an
          # already-dead process would fail a step whose assertions PASSED.
          # That is not hypothetical — the server dying is precisely what the
          # three curls above exist to catch.
          kill "$SERVER_PID" 2>/dev/null || true

      # The curls above prove the SERVER works. They cannot prove a PAGE does:
      # `ssr = false` means the static shell returns 200 whether or not the app
      # boots inside it, so /admin once shipped as an empty <body> with a green
      # check, 489 green tests and a perfect-looking kiosk route. This step is
      # the only thing in the pipeline that loads a route in a real browser and
      # asserts it rendered. AGENTS.md has required it before shipping UI or
      # state changes since that incident; it just was never wired up here.
      - name: Smoke test routes in a real browser
        env:
          AERO_DISABLE_LAN_PROXY: '1'
          PORT: '5401'
        run: |
          bun run serve --port 5401 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:5401/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          # ubuntu-latest ships Chrome at /usr/bin/google-chrome.
          #
          # SwiftShader, not --disable-gpu: the kiosk is a WebGL app, and a
          # runner has no GPU for the real path to bind to. SwiftShader is a
          # genuine WebGL2 implementation in software, so the page actually
          # initialises instead of failing in a way that looks like the blank
          # page this check exists to catch.
          google-chrome --headless=new --remote-debugging-port=9335 \
            --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --use-gl=swiftshader --enable-unsafe-swiftshader \
            about:blank &
          CHROME_PID=$!
          # POLL for the debugger rather than sleeping at it. A flat `sleep 5`
          # is a race that this job lost on its second run: ECONNREFUSED on
          # 127.0.0.1:9335 because Chrome had not finished binding the port.
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:9335/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          bun run smoke --base http://127.0.0.1:5401 --port 9335
          STATUS=$?
          kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

      # ── Fleet prebuilt ─────────────────────────────────────────────────
      # Rebuilt with the values every fielded Pi compiles in (install.sh
      # writes VITE_TILE_SERVER_URL=/api/tiles; no build-time token), so the
      # updater can install this instead of building on-device. A device whose
      # values differ builds locally, as before. Only on main pushes: that is
      # the only run whose sha can become `release`.
      - name: Package fleet prebuilt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          VITE_TILE_SERVER_URL: /api/tiles
          VITE_CESIUM_ION_TOKEN: ''
          VITE_MAPBOX_TOKEN: ''
        run: bash ../deploy/package-build.sh aero-1

      - name: Upload fleet prebuilt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-aero-1
          path: dist-prebuilt/aero-1.tar.gz*
          if-no-files-found: warn
          retention-days: 3

  # ── aero-2 ───────────────────────────────────────────────────────────────
  # The rewrite in aero-2/ had no CI of any kind. The job above covers v1 (now
  # in aero-1/), so aero-2 could be — and on 1a6c77e was — committed in a state
  # that cannot build from a clean clone: Settings.svelte imported
  # SCENE_PRESETS and applyPreset from a module that had not been committed yet.
  # It typechecked on the author's machine because the file was sitting
  # uncommitted in the working tree.
  #
  # tools/check-cycles.mjs cannot catch that class: the missing thing is an
  # EXPORT, not a file, so both ends of the edge are tracked. A typecheck on a
  # clean checkout is what catches it.
  #
  # Deliberately NOT a dependency of `promote`. aero-2 is pre-ship; the fleet
  # still runs v1, and a red rewrite must not hold back a green v1 deploy.
  aero-2:
    name: aero-2 — Type-check & Test
    runs-on: ubuntu-latest
    # Same reasoning as the job above. aero-2's smoke starts its own server AND
    # its own browser, so a bind failure here is the likeliest hang in the file.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aero-2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
          # Pinned, not `latest`. This job has been red since 2026-08-28 with a
          # rolldown dep-optimizer failure that has never reproduced on darwin
          # at the same lockfile — so the toolchain is the remaining variable,
          # and a floating one means a green build can turn red with no commit.
          # 1.4.2 is the version the tests pass on locally (bumped from 1.3.14
          # on 2026-09-29 to match the other job).

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` is svelte-check plus tools/check-cycles.mjs (no import cycles,
      # no tracked file importing an untracked one).
      - name: Type check
        run: bun run check

      # data/ is gitignored, so the tests that would read the 3.5 GB DEM archive
      # skip themselves here rather than failing. That is deliberate — see the
      # note on `the packed DEM covers every location that needs it`.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Same reasoning as the root job's smoke step: `check` and `test` both
      # reason about source and never mount anything, so a component that
      # throws during init is green in both and serves an empty body with a
      # 200. aero-2's own ARCHITECTURE.md records the parent repo shipping
      # /admin in exactly that state with 489 passing tests.
      #
      # NODE_ENV is left unset on purpose — that is the Pi's own configuration,
      # and it is what keeps the dev-only remote tile fallback off, so this runs
      # against the real offline behaviour instead of quietly proxying NASA.
      #
      # /api/tiles/health is expected to report a FATAL missing archive here
      # (data/ is gitignored, so there is no pack in CI) — the assertion is
      # that the endpoint answers and says so, not that it is happy. An
      # archive that is absent must look absent; that is the whole point of
      # REQUIRED_TILE_ASSETS.
      - name: Smoke test built server
        env:
          PORT: '3000'
        run: |
          bun run serve &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS --max-time 2 http://localhost:3000/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://localhost:3000/api/status
          curl -fsS --max-time 5 -o /dev/null http://localhost:3000/
          # Second request proves the process survived the first.
          curl -fsS --max-time 5 http://localhost:3000/api/tiles/health
          # `|| true`: GitHub runs these with `bash -e`, so a kill of an
          # already-dead process would fail a step whose assertions PASSED.
          # That is not hypothetical — the server dying is precisely what the
          # three curls above exist to catch.
          kill "$SERVER_PID" 2>/dev/null || true

      # Loads every route in a real browser and asserts it rendered — the check
      # no typecheck and no non-mounting unit test can perform. aero-2's own
      # tool starts the server and Chrome itself, so this is one command.
      - name: Smoke test routes in a real browser
        run: bun run smoke
        env:
          CHROME: /usr/bin/google-chrome

      # Same as aero-1's. PUBLIC_WALL_ORIGIN / AERO_MEDIA_ORIGINS are left empty
      # (the writer pane and a single pane); follower panes, which set them,
      # fail the updater's input check and build on-device.
      - name: Package fleet prebuilt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          VITE_TILE_SERVER_URL: /api/tiles
        run: bash ../deploy/package-build.sh aero-2

      - name: Upload fleet prebuilt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-aero-2
          path: dist-prebuilt/aero-2.tar.gz*
          if-no-files-found: warn
          retention-days: 3

  # ── Release promotion ────────────────────────────────────────────────────
  # The Pi fleet's daily updater tracks the `release` branch, NOT main.
  # This job is the deploy gate: only a green main run moves `release`.
  # A red commit on main simply never reaches the fleet.
  #
  # `release` is exclusively CI-owned — never push to it by hand. force=true
  # is correct here: the fleet consumes it with `git reset --hard`, so
  # non-fast-forward moves (e.g. after a main history rewrite) are absorbed.
  #
  # Gated on BOTH apps, not just v1.
  #
  # This used to need only `build-and-check`, on the reasoning that aero-2 was
  # pre-ship and a red rewrite must not hold back a green v1 deploy. That was
  # true while the fleet could only ever run v1 from the repo root. It stopped
  # being true when the updater learned to resolve an app directory: a device
  # with AERO_APP_SUBDIR=aero-2 now pulls `release` and builds the rewrite, so
  # a `release` blessed without aero-2 passing is a branch that can deploy code
  # CI never proved builds. The whole point of the gate is that a red commit
  # never reaches a Pi.
  promote:
    name: Promote to release
    needs: [build-and-check, aero-2]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A release upload (~95 MB) plus one ref move. Anything slower is a
    # GitHub outage, not a slow promotion, and it must not sit on a runner.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Publish the prebuilts BEFORE moving the ref, so a Pi that sees the new
      # `release` finds its build already there. Best-effort: a failure here
      # only means Pis build on-device for this sha, which is today's path —
      # it must never block the deploy itself.
      - name: Download fleet prebuilts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: prebuilt

      - name: Publish fleet prebuilts as build-${{ github.sha }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "build-${GITHUB_SHA}" prebuilt/* --repo "$REPO" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Fleet build ${GITHUB_SHA:0:8}" \
            --notes "CI-built aero-1 / aero-2 for ${GITHUB_SHA}. Installed by deploy/aero-updater.sh; not for humans."
          # Keep the newest 15 so a rollback a few releases back still finds
          # its build; older ones fall back to an on-device build.
          gh release list --repo "$REPO" --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' \
            | xargs -r -n1 gh release delete --repo "$REPO" --yes --cleanup-tag

      - name: Move release ref to ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/heads/release" --silent; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/release" \
              -f sha="${{ github.sha }}" -F force=true
          else
            # First green run bootstraps the branch.
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/release" -f sha="${{ github.sha }}"
          fi
